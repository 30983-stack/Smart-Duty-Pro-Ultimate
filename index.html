<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Duty Pro</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f4f7fb;
    color:#172033;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
    border-radius:12px;
    padding:10px 14px;
    font-weight:700;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
}

.loginbox{
    width:min(430px,100%);
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:0 20px 60px #0003;
}

.logo{
    font-size:42px;
    text-align:center;
}

.login h1{
    text-align:center;
    margin:8px 0;
}

.muted{
    color:#687386;
}

.field{
    margin:14px 0;
}

.field label{
    display:block;
    font-weight:700;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:12px;
    border:1px solid #d8deea;
    border-radius:11px;
    background:#fff;
}

.primary{
    background:#4f46e5;
    color:#fff;
}

.success{
    background:#16a34a;
    color:#fff;
}

.danger{
    background:#dc2626;
    color:#fff;
}

.warning{
    background:#f59e0b;
    color:#111;
}

.secondary{
    background:#e8edf7;
    color:#243047;
}

.small{
    padding:7px 10px;
    font-size:13px;
}

.demo{
    background:#f5f7ff;
    border-radius:14px;
    padding:12px;
    margin-top:15px;
    font-size:13px;
}

/* APP */

.app{
    min-height:100vh;
}

.top{
    height:64px;
    background:#fff;
    border-bottom:1px solid #e5e9f2;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:5;
}

.menu{
    font-size:22px;
    background:#eef2ff;
}

.brand{
    font-weight:900;
    font-size:20px;
}

.userpill{
    margin-left:auto;
    background:#f1f5f9;
    border-radius:99px;
    padding:8px 12px;
    font-size:13px;
}

.layout{
    display:flex;
}

.side{
    width:240px;
    background:#111827;
    color:white;
    min-height:calc(100vh - 64px);
    padding:16px;
    position:fixed;
    top:64px;
    left:0;
    bottom:0;
    overflow:auto;
}

.side button{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    color:#dbe4f0;
    margin:4px 0;
}

.side button:hover{
    background:#263244;
}

.main{
    margin-left:240px;
    width:calc(100% - 240px);
    padding:22px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.card{
    background:#fff;
    border:1px solid #e6eaf1;
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 16px #17203308;
}

.stat{
    font-size:28px;
    font-weight:900;
    margin-top:5px;
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:12px 0;
}

.tablewrap{
    overflow:auto;
    background:white;
    border-radius:16px;
    border:1px solid #e5e9f2;
}

.table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

.table th,
.table td{
    padding:12px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:99px;
    font-size:12px;
    font-weight:800;
}

.b-green{
    background:#dcfce7;
    color:#166534;
}

.b-red{
    background:#fee2e2;
    color:#991b1b;
}

.b-yellow{
    background:#fef3c7;
    color:#92400e;
}

.b-blue{
    background:#dbeafe;
    color:#1e40af;
}

.empty{
    text-align:center;
    padding:30px;
    color:#7b8798;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:grid;
    place-items:center;
    padding:18px;
    z-index:20;
}

.modalbox{
    width:min(620px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    padding:22px;
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    background:#eef2f7;
}

.preview{
    max-width:100%;
    max-height:330px;
    border-radius:12px;
    display:block;
    margin:10px auto;
}

.notice{
    padding:12px 14px;
    border-radius:12px;
    background:#eef2ff;
    margin:10px 0;
}

.dangerbox{
    background:#fff1f2;
}

.okbox{
    background:#ecfdf5;
}

/* MOBILE */

@media(max-width:800px){

    .side{
        transform:translateX(-100%);
        transition:.2s;
        z-index:10;
    }

    .side.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
        padding:14px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .brand{
        font-size:17px;
    }

    .userpill{
        font-size:11px;
    }
}

@media(max-width:480px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .stat{
        font-size:22px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="login">

    <div class="loginbox">

        <div class="logo">🏫</div>

        <h1>Smart Duty Pro</h1>

        <p class="muted" style="text-align:center">
            ระบบจัดเวรและตรวจสอบการทำเวร
        </p>

        <div class="field">

            <label>ชื่อผู้ใช้</label>

            <input
                id="username"
                placeholder="กรอกชื่อผู้ใช้"
            >

        </div>

        <div class="field">

            <label>รหัสผ่าน</label>

            <input
                id="password"
                type="password"
                placeholder="กรอกรหัสผ่าน"
                onkeydown="if(event.key==='Enter')login()"
            >

        </div>

        <button
            class="primary"
            style="width:100%"
            onclick="login()"
        >
            🔐 เข้าสู่ระบบ
        </button>

        <div id="loginMsg"></div>

        <div class="demo">

            <b>บัญชีทดลอง</b>

            <br>

            👨‍🏫 ครู:
            <b>teacher / 1234</b>

            <br>

            👑 หัวหน้าเวร:
            <b>leader / 1234</b>

            <br>

            👨‍🎓 นักเรียน:
            <b>student / 1234</b>

        </div>

    </div>

</div>

<!-- APP -->

<div id="app" class="app hidden">

<header class="top">

    <button
        class="menu"
        onclick="toggleSide()"
    >
        ☰
    </button>

    <div class="brand">
        🏫 Smart Duty Pro
    </div>

    <div
        id="userPill"
        class="userpill"
    ></div>

</header>

<div class="layout">

<aside id="side" class="side">

    <div
        style="font-size:13px;color:#94a3b8;margin:8px"
    >
        เมนูหลัก
    </div>

    <button onclick="page('dashboard')">
        📊 Dashboard
    </button>

    <button onclick="page('duties')">
        📅 ตารางเวร
    </button>

    <button onclick="page('check')">
        ✅ ตรวจเวร
    </button>

    <button onclick="page('evidence')">
        📸 หลักฐาน
    </button>

    <button onclick="page('requests')">
        📩 คำขอ
    </button>

    <button onclick="page('students')">
        👥 นักเรียน
    </button>

    <button onclick="page('reports')">
        📈 รายงาน
    </button>

    <button onclick="page('history')">
        📜 ประวัติ
    </button>

    <button onclick="logout()">
        🚪 ออกจากระบบ
    </button>

</aside>

<main class="main">

<section
    id="dashboard"
    class="view"
></section>

<section
    id="duties"
    class="view hidden"
></section>

<section
    id="check"
    class="view hidden"
></section>

<section
    id="evidence"
    class="view hidden"
></section>

<section
    id="requests"
    class="view hidden"
></section>

<section
    id="students"
    class="view hidden"
></section>

<section
    id="reports"
    class="view hidden"
></section>

<section
    id="history"
    class="view hidden"
></section>

</main>

</div>

</div>

<!-- MODAL -->

<div
    id="modal"
    class="modal hidden"
>

<div class="modalbox">

    <div class="modalhead">

        <h2 id="modalTitle"></h2>

        <button
            class="close"
            onclick="closeModal()"
        >
            ✕
        </button>

    </div>

    <div id="modalBody"></div>

</div>

</div><script>

const KEY = "smartDutyPro_single";

let me = null;

function today(){

    return new Date()
        .toISOString()
        .slice(0,10);

}

let data = loadData();


function loadData(){

    try{

        const saved =
            localStorage.getItem(KEY);

        if(saved){

            return JSON.parse(saved);

        }

    }catch(error){

        console.log(error);

    }

    return createData();

}


function createData(){

    const d = {

        students:[

            {
                id:1,
                name:"สมชาย ใจดี",
                class:"ม.3/1",
                user:"student"
            },

            {
                id:2,
                name:"สมหญิง รักเรียน",
                class:"ม.3/1",
                user:"student2"
            },

            {
                id:3,
                name:"กิตติ ขยันดี",
                class:"ม.3/1",
                user:"student3"
            },

            {
                id:4,
                name:"นภัส มีสุข",
                class:"ม.3/1",
                user:"student4"
            }

        ],

        duties:[],

        requests:[],

        evidence:[],

        logs:[],

        scores:{}

    };


    for(let i=0;i<12;i++){

        const s =
            d.students[i % d.students.length];

        d.duties.push({

            id:Date.now()+i,

            date:
                new Date(
                    Date.now()+i*86400000
                )
                .toISOString()
                .slice(0,10),

            studentId:s.id,

            status:"waiting",

            note:""

        });

    }


    saveData(d);

    return d;

}


function saveData(){

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );

}


function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[m];

        });

}


function roleName(role){

    if(role==="teacher")
        return "ครู";

    if(role==="leader")
        return "หัวหน้าเวร";

    return "นักเรียน";

}


function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value
        .trim();


    const accounts = {

        teacher:{
            pass:"1234",
            role:"teacher",
            name:"คุณครู"
        },

        leader:{
            pass:"1234",
            role:"leader",
            name:"หัวหน้าเวร"
        },

        student:{
            pass:"1234",
            role:"student",
            name:"สมชาย ใจดี"
        }

    };


    const account =
        accounts[username];


    if(
        !account ||
        account.pass !== password
    ){

        document
        .getElementById("loginMsg")
        .innerHTML = `

            <div class="notice dangerbox">

                ❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง

            </div>

        `;

        return;

    }


    me = {

        user:username,

        role:account.role,

        name:account.name

    };


    sessionStorage.setItem(
        "smartDutyUser",
        JSON.stringify(me)
    );


    document
    .getElementById("login")
    .classList
    .add("hidden");


    document
    .getElementById("app")
    .classList
    .remove("hidden");


    document
    .getElementById("userPill")
    .textContent =
        me.name +
        " • " +
        roleName(me.role);


    log("เข้าสู่ระบบ");


    page("dashboard");

}


function logout(){

    sessionStorage.removeItem(
        "smartDutyUser"
    );

    location.reload();

}


function toggleSide(){

    document
    .getElementById("side")
    .classList
    .toggle("open");

}


function page(id){

    document
    .querySelectorAll(".view")
    .forEach(function(section){

        section
        .classList
        .add("hidden");

    });


    const target =
        document.getElementById(id);


    if(target){

        target
        .classList
        .remove("hidden");

    }


    if(window.innerWidth < 801){

        document
        .getElementById("side")
        .classList
        .remove("open");

    }


    const pages = {

        dashboard:renderDashboard,

        duties:renderDuties,

        check:renderCheck,

        evidence:renderEvidence,

        requests:renderRequests,

        students:renderStudents,

        reports:renderReports,

        history:renderHistory

    };


    if(pages[id]){

        pages[id]();

    }

}


function log(text){

    data.logs.unshift({

        time:
            new Date()
            .toLocaleString("th-TH"),

        user:
            me
            ? me.name
            : "",

        text:text

    });


    saveData();

}


function getStudent(id){

    return data.students.find(function(s){

        return s.id == id;

    });

}


function currentStudentId(){

    const found =
        data.students.find(function(s){

            return s.name === me.name;

        });


    return found
        ? found.id
        : data.students[0].id;

}


function statusBadge(status){

    if(status==="done"){

        return `

            <span class="badge b-green">

                ✓ ทำแล้ว

            </span>

        `;

    }


    if(status==="missed"){

        return `

            <span class="badge b-red">

                ✗ ไม่ทำ

            </span>

        `;

    }


    return `

        <span class="badge b-yellow">

            ⏳ รอตรวจ

        </span>

    `;

}


function renderDashboard(){

    let duties =
        data.duties;


    if(me.role==="student"){

        duties =
            duties.filter(function(d){

                return d.studentId ===
                    currentStudentId();

            });

    }


    const total =
        duties.length;


    const done =
        duties.filter(function(d){

            return d.status==="done";

        }).length;


    const missed =
        duties.filter(function(d){

            return d.status==="missed";

        }).length;


    const waiting =
        duties.filter(function(d){

            return d.status==="waiting";

        }).length;


    document
    .getElementById("dashboard")
    .innerHTML = `

        <h1>📊 Dashboard</h1>

        <p class="muted">

            ยินดีต้อนรับ
            ${esc(me.name)}

        </p>


        <div class="grid">

            <div class="card">

                📅

                <div>เวรทั้งหมด</div>

                <div class="stat">

                    ${total}

                </div>

            </div>


            <div class="card">

                ✓

                <div>ทำแล้ว</div>

                <div class="stat">

                    ${done}

                </div>

            </div>


            <div class="card">

                ✗

                <div>ไม่ทำ</div>

                <div class="stat">

                    ${missed}

                </div>

            </div>


            <div class="card">

                ⏳

                <div>รอตรวจ</div>

                <div class="stat">

                    ${waiting}

                </div>

            </div>

        </div>


        <div
            class="card"
            style="margin-top:15px"
        >

            <h2>🔔 แจ้งเตือน</h2>

            ${renderNotifications()}

        </div>


        <div
            class="card"
            style="margin-top:15px"
        >

            <h2>📅 เวรวันนี้</h2>

            ${dutyTable(
                data.duties.filter(function(d){

                    return d.date===today();

                })
            )}

        </div>

    `;

}


function renderNotifications(){

    const requests =
        data.requests.filter(function(r){

            return r.status==="pending";

        }).length;


    const evidence =
        data.evidence.filter(function(e){

            return e.status==="pending";

        }).length;


    if(me.role==="student"){

        const myRequests =
            data.requests.filter(function(r){

                return(
                    r.studentId ===
                    currentStudentId()
                    &&
                    r.status==="pending"
                );

            }).length;


        return `

            <div class="notice">

                📩 คำขอของคุณที่รอผล:
                ${myRequests}
                รายการ

            </div>

        `;

    }


    return `

        <div class="notice">

            📩 คำขอรออนุมัติ:
            ${requests}
            รายการ

        </div>


        <div class="notice">

            📸 หลักฐานรอตรวจ:
            ${evidence}
            รายการ

        </div>

    `;

}


function dutyTable(rows){

    if(!rows.length){

        return `

            <div class="empty">

                ยังไม่มีข้อมูลเวร

            </div>

        `;

    }


    return `

        <div class="tablewrap">

            <table class="table">

                <tr>

                    <th>วันที่</th>

                    <th>นักเรียน</th>

                    <th>สถานะ</th>

                    <th>รายละเอียด</th>

                </tr>


                ${rows.map(function(d){

                    const s =
                        getStudent(
                            d.studentId
                        );


                    return `

                        <tr>

                            <td>
                                ${d.date}
                            </td>

                            <td>
                                ${esc(
                                    s
                                    ? s.name
                                    : "-"
                                )}
                            </td>

                            <td>
                                ${statusBadge(
                                    d.status
                                )}
                            </td>

                            <td>
                                ${esc(
                                    d.note || "-"
                                )}
                            </td>

                        </tr>

                    `;

                }).join("")}

            </table>

        </div>

    `;

}


function renderDuties(){

    let rows =
        data.duties;


    if(me.role==="student"){

        rows =
            rows.filter(function(d){

                return d.studentId ===
                    currentStudentId();

            });

    }


    document
    .getElementById("duties")
    .innerHTML = `

        <h1>📅 ตารางเวร</h1>

        <div class="toolbar">

            ${
                me.role==="teacher"

                ?

                `

                <button
                    class="primary"
                    onclick="addDuty()"
                >

                    ➕ เพิ่มเวร

                </button>

                `

                :

                ""

            }


            <button
                class="secondary"
                onclick="page('evidence')"
            >

                📸 ส่งหลักฐาน

            </button>


            <button
                class="secondary"
                onclick="page('requests')"
            >

                📩 ขอหยุด / สลับเวร

            </button>

        </div>


        ${dutyTable(rows)}

    `;

}


function renderCheck(){

    if(me.role==="student"){

        document
        .getElementById("check")
        .innerHTML = `

            <h1>✅ ตรวจเวร</h1>

            <div class="notice">

                หน้านี้สำหรับหัวหน้าเวรและครู

            </div>

        `;

        return;

    }


    document
    .getElementById("check")
    .innerHTML = `

        <h1>✅ ตรวจเวร</h1>

        <div class="tablewrap">

            <table class="table">

                <tr>

                    <th>วันที่</th>

                    <th>นักเรียน</th>

                    <th>สถานะ</th>

                    <th>การตรวจ</th>

                </tr>


                ${data.duties.map(function(d){

                    const s =
                        getStudent(
                            d.studentId
                        );


                    return `

                        <tr>

                            <td>
                                ${d.date}
                            </td>

                            <td>
                                ${esc(
                                    s
                                    ? s.name
                                    : "-"
                                )}
                            </td>

                            <td>
                                ${statusBadge(
                                    d.status
                                )}
                            </td>

                            <td>

                                ${
                                    d.status==="waiting"

                                    ?

                                    `

                                    <button
                                        class="success small"
                                        onclick="markDuty(${d.id},'done')"
                                    >

                                        ✓ ทำแล้ว

                                    </button>


                                    <button
                                        class="danger small"
                                        onclick="markDuty(${d.id},'missed')"
                                    >

                                        ✗ ไม่ทำ

                                    </button>

                                    `

                                    :

                                    "-"

                                }

                            </td>

                        </tr>

                    `;

                }).join("")}

            </table>

        </div>

    `;

}


function markDuty(id,status){

    const duty =
        data.duties.find(function(d){

            return d.id == id;

        });


    if(!duty)return;


    duty.status =
        status;


    duty.note =
        status==="missed"
        ? "ไม่ได้ทำเวร"
        : "";


    log(

function saveStudent(){

    const name =
        document
        .getElementById("studentName")
        .value
        .trim();


    const className =
        document
        .getElementById("studentClass")
        .value
        .trim();


    if(!name){

        alert(
            "กรุณากรอกชื่อนักเรียน"
        );

        return;

    }


    data.students.push({

        id:Date.now(),

        name:name,

        class:
            className || "-",

        user:
            "student" +
            Date.now()

    });


    log(
        "เพิ่มนักเรียน " + name
    );


    saveData();

    closeModal();

    renderStudents();

}


function deleteStudent(id){

    if(
        !confirm(
            "ต้องการลบนักเรียนคนนี้หรือไม่?"
        )
    ){

        return;

    }


    data.students =
        data.students.filter(function(s){

            return s.id != id;

        });


    log(
        "ลบนักเรียน"
    );


    saveData();

    renderStudents();

}

function openModal(title,body){

    document
    .getElementById("modalTitle")
    .textContent = title;


    document
    .getElementById("modalBody")
    .innerHTML = body;


    document
    .getElementById("modal")
    .classList
    .remove("hidden");

}


function closeModal(){

    document
    .getElementById("modal")
    .classList
    .add("hidden");

}
